name: Validate Tracebound
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo build --release --locked
      - run: python scripts/generate_cases.py --check
      - if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - if: runner.os != 'Windows'
        run: python scripts/verify_oracle.py --binary target/release/tracebound
      - if: runner.os == 'Windows'
        run: python scripts/verify_oracle.py --binary target/release/tracebound.exe
  browser-and-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: cargo build --release --locked
      - run: python scripts/build_web.py
      - run: node scripts/check_wasm.mjs
      - run: node --test scripts/check_frontend.mjs
      - run: python scripts/demo_workspace.py --output-dir /tmp/tracebound-ci-workspace
      - run: python scripts/postgres_lab.py --binary target/release/tracebound --case examples/split-merge-cycle.json
